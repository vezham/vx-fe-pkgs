info:
  title: Tamizhi API
  version: 1.0.0
openapi: 3.1.0
paths:
  /approvals:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalDecision'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Successful response
        "401":
          description: Sign in required
        "403":
          description: Access denied
        "409":
          description: Concurrent update conflict
  /attachments:
    post:
      requestBody:
        content:
          multipart/form-data:
            schema:
              properties:
                file:
                  format: binary
                  type: string
              required:
              - file
              type: object
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
          description: Successful response
        "401":
          description: Sign in required
        "403":
          description: Access denied
        "409":
          description: Concurrent update conflict
  /audio/speech:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpeechRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Successful response
        "401":
          description: Sign in required
        "403":
          description: Access denied
        "409":
          description: Concurrent update conflict
  /audio/transcriptions:
    post:
      requestBody:
        content:
          multipart/form-data:
            schema:
              properties:
                file:
                  format: binary
                  type: string
              required:
              - file
              type: object
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transcript'
          description: Successful response
        "401":
          description: Sign in required
        "403":
          description: Access denied
        "409":
          description: Concurrent update conflict
  /auth/session:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
          description: Successful response
        "401":
          description: Sign in required
        "403":
          description: Access denied
        "409":
          description: Concurrent update conflict
      security: []
  /capabilities:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Capabilities'
          description: Successful response
        "401":
          description: Sign in required
        "403":
          description: Access denied
        "409":
          description: Concurrent update conflict
  /chat:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunRequest'
        required: true
      responses:
        "200":
          content:
            text/event-stream:
              schema:
                type: string
          description: Durable SSE events. Resume using sequence in Last-Event-ID or after query.
  /conversations:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationPage'
          description: Successful response
        "401":
          description: Sign in required
        "403":
          description: Access denied
        "409":
          description: Concurrent update conflict
  /conversations/{id}:
    delete:
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIError'
          description: Successful response
        "401":
          description: Sign in required
        "403":
          description: Access denied
        "409":
          description: Concurrent update conflict
    get:
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
          description: Successful response
        "401":
          description: Sign in required
        "403":
          description: Access denied
        "409":
          description: Concurrent update conflict
    patch:
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
          description: Successful response
        "401":
          description: Sign in required
        "403":
          description: Access denied
        "409":
          description: Concurrent update conflict
  /conversations/{id}/branches:
    post:
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
