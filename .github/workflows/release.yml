# @vx/INFO: @vx/ci
name: 🚀 Release

run-name: >
  🚀 Release • ${{ github.event_name == 'schedule' && '🕒 Scheduled' || inputs.version != '' && format('📦 {0}', inputs.version) || '⚡ Trails' }}${{ inputs.dryRun && ' • 🧪 Dry run' || '' }}
  - by @${{ github.actor || 'vx/ci' }}

on:
  schedule:
    - cron: '30 23 * * 2,5' # every Wed, Sat at 05:00 AM IST
  workflow_dispatch:
    inputs:
      version:
        required: false
        type: string
        description: Explicit version or SemVer increment; empty uses conventional commits
        default: ''
      firstRelease:
        required: false
        type: boolean
        description: Bootstrap without an existing release tag; provide an explicit version
        default: false
      dryRun:
        required: false
        type: boolean
        description: Preview versioning, changelog and publishing without releasing
        default: false

concurrency:
  group: npm-release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  id-token: write # npm provenance
  checks: write # check runs
  contents: write # commits, tags, pushes
  pull-requests: write # PR comments

env:
  REPO: ${{ github.repository }}
  BRANCH: ${{ github.ref_name }}
  ACTOR: ${{ github.actor || 'vx/ci' }}
  NX_NO_CLOUD: true

jobs:
  release:
    if: ${{ github.ref_type == 'branch' && (github.ref_name == github.event.repository.default_branch || inputs.dryRun == true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 🔵 · ✅ Validate release options
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          FIRST_RELEASE: ${{ inputs.firstRelease }}
        run: |
          if [[ -n "$RELEASE_VERSION" && ! "$RELEASE_VERSION" =~ ^[0-9A-Za-z.+-]+$ ]]; then
            echo 'Version must be a SemVer version or increment without shell syntax.' >&2
            exit 1
          fi
          if [[ "$FIRST_RELEASE" == 'true' && -z "$RELEASE_VERSION" ]]; then
            echo 'First release requires an explicit version, such as 0.0.1.' >&2
            exit 1
          fi

      - name: 🟠 · 🧰 Checkout • ${{ env.REPO }}@${{ env.BRANCH }}
        uses: vezham/vx-deployer/.github/actions/common/setup-checkout@timeline
        with:
          GIT_REPO: ${{ env.REPO }}
          GIT_BRANCH: ${{ env.BRANCH }}

      - name: 🟠 · 🧩 Setup Node & pnpm
        uses: vezham/vx-deployer/.github/actions/common/setup-install-npm@timeline
        with:
          NPM_TOKEN: ${{ secrets.VX_DEPLOYER_NPM }}
          HEROUI_AUTH_TOKEN: ${{ secrets.HEROUI_AUTH_TOKEN }}

      - name: 🟠 · 📦 NX • NPM Release
        uses: vezham/vx-deployer/.github/actions/nx/release@timeline
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.VX_DEPLOYER_NPM }}
          NPM_PROVENANCE: true
          version: ${{ inputs.version }}
          args: ${{ format('{0} {1}', inputs.firstRelease && '--firstRelease' || '', inputs.dryRun && '--dryRun' || '') }}

      - name: 🟠 · ⛭ NX • Post Ops
        if: always()
        uses: vezham/vx-deployer/.github/actions/nx/post-ops@timeline

  summary:
    if: ${{ always() && needs.release.result != 'skipped' }}
    needs: [release]
    runs-on: ubuntu-latest

    steps:
      - name: 🟠 · 🧾 Release Summary
        uses: vezham/vx-deployer/.github/actions/common/summary-release@timeline
        with:
          actor: ${{ env.ACTOR }}
          token: ${{ secrets.GITHUB_TOKEN }}
          version: ${{ inputs.version }}
          args: ${{ format('{0} {1}', inputs.firstRelease && '--firstRelease' || '', inputs.dryRun && '--dryRun' || '') }}
          release_result: ${{ needs.release.result }}
