packages:
  - 'packages/*'
  - 'packages/*/*'
  - '!packages/vx/styles'
  - 'apps/*'
  - 'apps-*/*'

catalog:
  '@playwright/test': ^1.65.0
  '@internationalized/date': 3.12.4
  '@vezham/auth': 'npm:better-auth@1.7.2'
  '@vezham/auth-agent-auth': 'npm:@better-auth/agent-auth@^0.6.2'
  '@vezham/auth-api-key': 'npm:@better-auth/api-key@1.7.2'
  '@vezham/auth-infra': 'npm:@better-auth/infra@^0.4.28'
  '@vezham/auth-oauth-provider': 'npm:@better-auth/oauth-provider@1.7.2'
  '@vezham/auth-passkey': 'npm:@better-auth/passkey@1.7.2'
  '@vezham/auth-sso': 'npm:@better-auth/sso@1.7.2'
  '@vezham/auth-stripe': 'npm:@better-auth/stripe@1.7.2'
  '@vezham/icons-react': 1.0.7
  '@vezham/react-pro-v3': 'npm:@heroui-pro/react@1.0.0-beta.11'
  '@vezham/react-v3': 'npm:@heroui/react@3.2.7'
  # vx-bot/NOTE: Reserved for app keyboard shortcuts; keep the Fallow directive below intact.
  # fallow-ignore-next-line unused-catalog-entry
  '@tanstack/react-hotkeys': ^0.10.0
  react: 19.2.7
  react-dom: 19.2.7
  react-aria-components: 1.22.1
  react-markdown: ^10.1.0
  tailwind-variants: 3.3.1
  vite: 8.1.6
  yaml: 2.9.1
  # vx-bot/NOTE: vx-pkgs
  '@vezham/env': workspace:*
  '@vezham/react': workspace:*
  '@vezham/start': workspace:*
  '@vezham/template': workspace:*
  '@vezham/utils': workspace:*
  '@vezham/devtools': workspace:*
  '@vezham/config': workspace:*
  # vx-bot/NOTE: Reserve the hooks catalog version for future direct workspace consumers.
  # fallow-ignore-next-line unused-catalog-entry
  '@vezham/hooks': workspace:*

# vx-bot/NOTE: Resolve docs packages' upstream peer names to the workspace's Vezham forks.
# vx-bot/TODO: Remove these overrides when the published @vx-oss docs packages use
# @vx-oss package names in their imports and peer dependencies.
overrides:
  fumadocs-core: npm:@vx-oss/docs-core@1.0.17
  fumadocs-ui: npm:@vx-oss/docs-base-ui@1.0.17

  # vx-bot/NOTE: Keep upstream auth peers aligned with the Vezham catalog aliases.
  # Switch these targets with the catalog when the Vezham forks are published.
  better-auth: npm:better-auth@1.7.2
  '@better-auth/agent-auth': npm:@better-auth/agent-auth@^0.6.2
  '@better-auth/api-key': npm:@better-auth/api-key@1.7.2
  '@better-auth/infra': npm:@better-auth/infra@^0.4.28
  # vx-bot/NOTE: Align Infrastructure callback types with the pinned auth engine's fetch client.
  '@better-auth/infra>@better-fetch/fetch': 1.3.1
  '@better-auth/oauth-provider': npm:@better-auth/oauth-provider@1.7.2
  '@better-auth/passkey': npm:@better-auth/passkey@1.7.2
  '@better-auth/sso': npm:@better-auth/sso@1.7.2
  '@better-auth/stripe': npm:@better-auth/stripe@1.7.2

  # vx-bot/NOTE: Pin patched transitive dependencies until upstream ranges include the fixes.
  # vx-bot/TODO: Codex should review these security overrides when updating dependencies.
  # Remove each override only when upstream resolves patched versions without it;
  # regenerate the lockfile, run pnpm audit, and run relevant Nx checks before keeping the removal.
  # Retain overrides still needed to prevent vulnerable versions from returning.
  'next>postcss@<8.5.23': 8.5.23
  'sharp@<0.35.5': 0.35.5
  'axios@>=1.0.0 <1.20.0': 1.20.0
  '@cypress/request>uuid@<11.1.1': 11.1.1
  'qs@<6.16.0': 6.16.0
  'undici@>=7.0.0 <7.30.1': 7.30.1
  'js-yaml@>=4.0.0 <4.3.2': 4.3.2
  'smol-toml@<1.9.0': 1.9.0
  'seroval@<1.6.8': 1.6.8
  'handlebars@>=4.0.0 <4.7.10': 4.7.10
  'http-cache-semantics@<4.3.0': 4.3.0
  'compression@<1.8.2': 1.8.2
  'brace-expansion@>=4.0.0 <5.0.12': 5.0.12
  'figlet@<1.11.3': 1.11.3
  'serialize-javascript@>=7.1.1 <7.1.3': 7.1.3
  'follow-redirects@<1.16.1': 1.16.1
  'body-parser@>=1.0.0 <1.20.9': 1.20.9
  'fast-uri@>=3.0.0 <3.1.9': 3.1.9

# vx-bot/NOTE: Run pre/post hooks around workspace package scripts.
enablePrePostScripts: true

# vx-bot/NOTE: Hoist internal packages so tools relying on Node.js resolution
# (e.g. Storybook, Vite plugins, ESLint, etc.) can resolve them consistently.
publicHoistPattern:
  - '*@vezham/*'
  - '*@vx-oss/*'
  - '*@vx-pro/*'

minimumReleaseAge: 10080 # wjdlz/NOTE: days in minutes - 5 = 7200, 7 = 10080, 14 = 20160
minimumReleaseAgeExclude:
  - '@vx-cli/*'
  - '@vx-oss/*'
  - '@vezham/*'

allowBuilds:
  heroui-pro: true
  '@heroui-pro/react': true
  heroui-native-pro: true
  lightningcss: true
  esbuild: true
  '@parcel/watcher': false
  '@swc/core': false
  '@vx-oss/heroui-v2-shared-utils': false
  '@zowe/secrets-for-zowe-sdk': false
  less: false
  nx: false
  sharp: false
  unrs-resolver: false

blockExoticSubdeps: true
trustPolicy: no-downgrade
trustPolicyExclude:
  - 'pino@9.14.0'
  - 'semver@6.3.1'
  - 'undici-types@6.21.0'
